<!doctype html>
<html lang="es"><head><meta charset="utf-8"/>
<style>
@font-face{font-family:Inter;src:url('../../public/fonts/InterVariable.woff2') format('woff2');font-weight:100 900}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#101215;font-family:Inter,system-ui,sans-serif;color:#fff}
.bg{position:absolute;inset:0;background:
  radial-gradient(700px 420px at 92% 8%,rgba(62,128,107,.38),transparent 70%),
  radial-gradient(520px 360px at 0% 100%,rgba(62,128,107,.16),transparent 70%),#101215}
.grid{position:absolute;inset:0;opacity:.06;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(90deg,#000,transparent 70%)}
.left{position:absolute;left:72px;top:64px;width:520px;bottom:64px;display:flex;flex-direction:column}
.logo{height:62px;align-self:flex-start;margin-left:-6px}
.kicker{margin-top:auto;font-size:15px;font-weight:600;letter-spacing:.22em;color:#7CC4AB;text-transform:uppercase}
h1{margin-top:18px;font-size:76px;line-height:.98;font-weight:800;letter-spacing:-.045em}
h1 i{font-style:normal;color:#3E806B}
p{margin-top:22px;font-size:26px;line-height:1.35;color:#B7BEC6;font-weight:450;letter-spacing:-.01em}
.chips{margin-top:34px;display:flex;gap:10px}
.chips span{font-size:17px;font-weight:600;padding:10px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#E8ECEF}
.shot{position:absolute;left:640px;top:70px;width:760px;height:475px;border-radius:22px;overflow:hidden;background:#E9EEF2;
  box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.14);transform:rotate(-2.2deg)}
.shot img{position:absolute;left:-452px;top:-100px;width:1512px}
.fade{position:absolute;right:0;top:0;bottom:0;width:60px;background:linear-gradient(90deg,transparent,#101215)}
</style></head><body>
<div class="bg"></div><div class="grid"></div>
<div class="shot"><img src="../release-2026-10-16/panel-1440.png"/></div>
<div class="left">
  <img class="logo" src="../../public/brand/modo-logo-horizontal-blanco.svg"/>
  <div class="kicker">Automatización · Robótica · Aprendizaje</div>
  <h1>Tu espacio<br/>de trabajo<i>.</i></h1>
  <p>Practica, estudia y construye a tu ritmo.</p>
  <div class="chips"><span>Simulador</span><span>Estudio</span><span>Laboratorio</span></div>
</div>

</body></html>
