const tag=(x,y,s)=>{let w=Math.max(28,String(s).length*7+18);return rect(x-w/2,y-13,w,22,'#f5f3ed',2,'stroke="#bec4c7"')+txt(x,y+3,s,11,700)};
const socket=(t,m)=>{const k=m.id+':'+t.id;const active=k===selected;const hit=query&&`${m.id} ${m.title} ${t.id}`.toLowerCase().includes(query.toLowerCase());const color=colors[t.color];const label=t.id.match(/^S\d:([1-4])$/)?.[1]||t.id.replace('PILOTO_','P');let lx=t.x,ly=t.labelSide==='top'?t.y-23:t.y+29;if(t.labelSide==='left')lx-=30;if(t.labelSide==='right')lx+=31;
return `<g class="socket-interactive" tabindex="0" role="button" aria-label="${esc(m.title)} · ${esc(t.id)}" data-port="${esc(k)}">${(active||hit)?cir(t.x,t.y,25,'none',`stroke="${active?'#eca83d':'#408ede'}" stroke-width="5"`):''}${cir(t.x,t.y,23,'transparent')}${cir(t.x+1,t.y+2,17,'#717982','opacity=".27"')}${cir(t.x,t.y,15,'url(#socketMetal)','stroke="#899099"')}${cir(t.x,t.y,12,color,`stroke="${t.color==='white'?'#a9a69e':'#24272d'}" stroke-width="1.5"`)}${cir(t.x,t.y,6.5,'#141a21','stroke="#66717b" stroke-width="1.2"')}${txt(lx,ly,label,12,750)}<title>${esc(t.id)} · ${esc(t.note||'')}</title></g>`};
const pilot=(x,y,c)=>cir(x,y,31,'#79818a','stroke="#505863" stroke-width="6"')+cir(x,y,25,c,'stroke="#202830" stroke-width="4"')+`<path d="M${x-14} ${y-8} Q${x-2} ${y-19} ${x+13} ${y-9}" stroke="#fff" fill="none" stroke-width="3" opacity=".28"/>`;
const press=(x,y,c)=>cir(x,y,34,'#acb4ba','stroke="#737c85" stroke-width="4"')+cir(x,y,29,c,'stroke="#313a42" stroke-width="4"')+`<path d="M${x-17} ${y-9} Q${x} ${y-22} ${x+16} ${y-8}" stroke="#fff" opacity=".18" fill="none" stroke-width="3"/>`;
const device=(x,y,w,h,kind='contactor')=>`${rect(x+3,y+6,w,h,'#2d343b',7,'opacity=".27"')}${rect(x,y,w,h,'#48515a',6,'stroke="#303840" stroke-width="3"')}${rect(x+13,y+34,w-26,h-61,'#eaedea',4,'stroke="#a7afb0" stroke-width="3"')}${Array.from({length:4},(_,i)=>rect(x+9+i*(w-16)/4,y+7,(w-29)/4,22,'#ebedeb',2,'stroke="#7b8588"')+cir(x+18+i*(w-16)/4,y+17,4,'#333942')).join('')}${Array.from({length:4},(_,i)=>rect(x+9+i*(w-16)/4,y+h-25,(w-29)/4,17,'#ebedeb',2,'stroke="#7b8588"')).join('')}${kind==='timer'?cir(x+w/2,y+h/2+9,35,'#d7c9ae','stroke="#765d4b" stroke-width="7"')+cir(x+w/2,y+h/2+9,25,'#eae7e1','stroke="#ac8261" stroke-width="2"')+`<path d="M${x+w/2} ${y+h/2+9} l16 -13" stroke="#836047" stroke-width="3"/>`:txt(x+w/2,y+72,kind==='thermal'?'RELÉ TÉRMICO':'CONTACTOR',12,700,'#4a535c')}`;
const face=(m)=>{
 let s=rect(0,0,m.w,m.h,'url(#panelFace)',3,'stroke="#969ba1" stroke-width="2" filter="url(#moduleShadow)"')+rect(9,8,m.w-18,m.h-16,'none',2,'stroke="#fff" stroke-width="1.5" opacity=".6"');
 [18,m.w-18].forEach(x=>[19,m.h-18].forEach(y=>{s+=cir(x,y,4,'#8a939a','stroke="#eee" stroke-width="1.5"')}));
 if(m.category!=='motor')s+=tag(m.w/2,27,m.category==='alimentacion'?'ALIMENTACIÓN · 24 V A.C.':m.category==='botoneras'?'LUCES PILOTO 24 V A.C.':m.title);
 if(m.category==='alimentacion'){
  s+=rect(18,45,183,151,'#f2f3f3',10,'stroke="#adb4ba" stroke-width="3"')+rect(35,60,151,99,'#22282f',2)+rect(88,162,40,18,'#e2e3e2')+rect(221,49,111,89,'#b1b9be',5,'stroke="#77838a" stroke-width="2"')+rect(230,63,93,52,'#e2e0d9')+txt(277,79,'220 V',12)+txt(277,95,'0 – 24 V',12)+txt(277,112,'3 A',12);
  s+=rect(352,53,201,81,'#edece4',8,'stroke="#aeb2b7" stroke-width="3"')+[395,491].map(x=>rect(x-17,63,34,61,'#fafafa',2,'stroke="#b6babd"')+cir(x,78,4,'#161f24')+cir(x,96,4,'#161f24')).join('');
  [57,120,183,246,309].forEach((x,i)=>s+=pilot(x,181,['#b42836','#bd3446','#a7202f','#1c2128','#d7a63b'][i]));s+=tag(278,210,'FUS 3A');
 }
 if(m.category==='botoneras'){[78,228,378,530].forEach((x,i)=>s+=pilot(x,57,['#18744f','#a22e3a','#dfaa2a','#18744f'][i]));s+=tag(300,133,'BOTONERAS');[115,303,488].forEach((x,i)=>s+=press(x,168,i===1?'#8f2c36':'#17674f'));}
 if(m.category==='contactores'){
 s+=m.id==='CONTACTOR_TERMICO'?device(18,114,127,154,'thermal'):device(234,122,143,148);
 s+=rect(m.w-112,43,82,28,'#f4f1e8',2,'stroke="#d1d3d0"')+txt(m.w-71,61,aliases[m.id]||'KM ?',13,800,'#555b60');
 }
 if(m.category==='temporizadores'){s+=tag(m.w/2,44,'BOBINA 24 V A.C.');s+=device(189,99,126,124,'timer');}
 if(m.category==='motor'){s+=rect(12,44,m.w-24,185,'#f1f1ed',10,'stroke="#cdd3d4" stroke-width="2"')+rect(175,44,26,185,'#e9c932')+`<text x="190" y="130" transform="rotate(90 190 130)" text-anchor="middle" font-family="Arial" font-weight="800" font-size="13">BORNE MOTOR</text>`+tag(m.w/2,43,'MOTOR');}
 if(m.category!=='motor')s+=`<g transform="translate(${m.w/2-20} ${m.h-20})">${rect(0,0,10,10,'#d42c38',0)}${txt(41,10,'inacap',14,800,'#3b4147')}</g>`;
 return s;
};
function boardMarkup(){let s=`<svg id="board-svg" xmlns="http://www.w3.org/2000/svg" class="board-svg" viewBox="${view.x} ${view.y} ${view.w} ${view.h}" aria-label="Panel interactivo de INACAP">${svgDefs}${rect(0,0,1400,1100,'#f3f5f6',0)}${rect(27,27,1349,1045,'#e5e9ec',10,'stroke="#969fa8" stroke-width="4"')}`;
 [42,378,765,1064].forEach(y=>{s+=rect(28,y,1347,29,'url(#railMetal)',5)+`<path d="M36 ${y+4} H1367" stroke="#e9edef" stroke-width="2"/>`});[0,1,2].forEach(i=>s+=rect(36,i*355+102,1330,80,'url(#vent)',0,'opacity=".55"'));
 MODULES.forEach(m=>{const faded=group!=='todos'&&m.category!==group;const high=query&&`${m.title} ${m.id} ${aliases[m.id]||''} ${m.terminals.map(t=>t.id).join(' ')}`.toLowerCase().includes(query.toLowerCase());s+=`<g transform="translate(${m.x} ${m.y})" opacity="${faded?.2:1}">${face(m)}${high?rect(-4,-4,m.w+8,m.h+8,'none',6,'stroke="#e7a346" stroke-width="4"'):''}${m.terminals.map(t=>socket(t,m)).join('')}</g>`});s+=txt(700,1093,'PANEL DIDÁCTICO · REFERENCIA GRÁFICA DESENERGIZADA',15,750,'#7c8791')+'</svg>';return s}
function renderBoard(){document.getElementById('board-root').innerHTML=boardMarkup();document.getElementById('zoom-label').textContent=Math.round(1400/view.w*100)+'%';}
function renderFilters(){document.getElementById('filters').innerHTML=groups.map(([k,t])=>`<button data-filter="${k}" class="filter-pill ${group===k?'current':''}" role="tab" aria-selected="${group===k}">${t}</button>`).join('')}
function renderSearch(){let el=document.getElementById('search-results');if(!query.trim()){el.style.display='none';return}let q=query.toLowerCase();let a=MODULES.flatMap(m=>m.terminals.filter(t=>`${m.title} ${m.id} ${aliases[m.id]||''} ${t.id}`.toLowerCase().includes(q)).map(t=>({m,t}))).slice(0,8);el.style.display='block';el.innerHTML=a.length?a.map(({m,t})=>`<button data-search-id="${m.id}:${t.id}"><span class="search-socket" style="background:${colors[t.color]}"></span><div><strong>${esc(t.id)}</strong><small>${esc(m.title)}</small></div><span>→</span></button>`).join(''):'<div class="search-empty">No hay coincidencias.</div>'}
function renderInspector(){const r=getRecord(),m=r?.m||MODULES[1],t=r?.t||null;let head=`<div class="inspector-top"><div><div class="eyebrow">IDENTIFICACIÓN</div><h2>Inspector</h2></div><span class="inspector-icon">⚙</span></div><div class="inspector-tabs"><button data-tab="terminal" class="${tab==='terminal'?'active':''}">Borne</button><button data-tab="module" class="${tab==='module'?'active':''}">Módulo</button></div>`;
 if(tab==='terminal'&&t){let typ=t.verification==='foto'?'Identificación visual':t.verification==='no_verificado'?'Pendiente de confirmar':'Convención por confirmar';head+=`<div class="terminal-feature"><div class="feature-topline"><span>SELECCIONADO</span><span>✓</span></div><div class="feature-socket" style="border-color:${colors[t.color]}"><span></span></div><span class="feature-id">${esc(t.id.match(/^S\d:([1-4])$/)?.[1]||t.id.replace('PILOTO_','P'))}</span><span class="feature-module">${esc(m.title)}</span></div><div class="info-lines"><div><span>Identificador completo</span><strong>${esc(m.id+':'+t.id)}</strong></div><div><span>Color del borne</span><strong><i class="color-dot" style="background:${colors[t.color]}"></i>${colorNames[t.color]}</strong></div><div><span>Función / contacto</span><strong>${esc(t.state||t.note||'—')}</strong></div></div><div class="verification ${t.verification==='foto'?'confirmed':'pending'}"><span>${t.verification==='foto'?'✓':'!'}</span><div><strong>${typ}</strong><p>${info[t.verification||'foto']}</p></div></div><button class="outline-full" data-focus="${m.id}">⊞ Enfocar módulo</button>`;
 }else{head+=`<div class="module-detail"><div class="module-tag">MÓDULO DEL PANEL</div><h3>${esc(m.title)}</h3><p class="module-subtitle">${esc(m.subtitle||'')}</p><p class="module-summary">${esc(m.summary)}</p><div class="module-count"><strong>${m.terminals.length}</strong><span>bornes documentados</span></div>${m.aliasEditable?`<div class="alias-area"><label for="alias-input">Código en diagrama (KM...)</label><div><input id="alias-input" placeholder="Por confirmar" value="${esc(aliases[m.id]||'')}" maxlength="14"/><button data-save-alias="${m.id}">Guardar</button></div><small>Etiqueta personal sin validación del esquema original.</small></div>`:''}<button class="outline-full" data-focus="${m.id}">⊞ Ver de cerca</button></div>`;}
 head+=`<div class="photo-reference"><div class="photo-header"><div><strong>Referencia fotográfica</strong><small>Imagen original del laboratorio</small></div><button data-photo="1" title="Ampliar">↗</button></div><button class="photo-preview" data-photo="1"><img src="${getPhoto(m)}" alt="Fotografía: ${esc(m.title)}"/><span>↗ Ampliar foto</span></button></div><div class="inspector-bottom"><span class="round-info">i</span> Fase 1: reconocimiento. Los cables banana llegarán en la siguiente etapa.</div>`;
 document.getElementById('inspector').innerHTML=head;
}
const focus=m=>{let w=Math.max(m.w+165,480),h=w*1100/1400;view={x:m.x+m.w/2-w/2,y:m.y+m.h/2-h/2,w,h};group='todos';renderFilters();renderBoard()};
const zoom=f=>{let w=Math.max(340,Math.min(1400,view.w*f)),h=w*1100/1400;view={x:view.x+(view.w-w)/2,y:view.y+(view.h-h)/2,w,h};renderBoard()};
const pick=id=>{selected=id;tab='terminal';save();renderBoard();renderInspector()};
const showModal=(type)=>{let m=getRecord()?.m||MODULES[1];let body=type==='photo'?`<img src="${getPhoto(m)}" alt="${esc(m.title)}"/><p>Fotografía del laboratorio para comparar los detalles reales del módulo.</p>`:`<div class="help-text"><p>Esta primera fase sirve para reconocer componentes y bornes. Todavía no se conectan cables ni se simula energía.</p><ol><li>Selecciona cualquier borne circular en el tablero.</li><li>Mira su identificación y color en el inspector.</li><li>Utiliza + y − para hacer zoom, o arrastra los espacios vacíos del tablero.</li><li>Amplía la fotografía real en la parte inferior del inspector.</li><li>Las referencias KM y los contactos NA/NC pendientes se deben confirmar con el profesor.</li></ol><p><b>Seguridad:</b> solo práctica virtual. Nunca energices el banco sin el docente.</p></div>`;
 document.getElementById('overlay-root').innerHTML=`<div class="modal-backdrop" id="modal-backdrop"><div class="dialog ${type==='photo'?'dialog-image':''}" role="dialog" aria-modal="true"><div class="dialog-top"><strong>${type==='photo'?esc(m.title):'Cómo utilizar PanelLab'}</strong><button id="close-dialog">×</button></div>${body}</div></div>`};
function mount(){out(appHeader()+appBody());renderFilters();renderBoard();renderInspector();
 document.getElementById('help-button').onclick=()=>showModal('help');
 document.getElementById('zoom-out').onclick=()=>zoom(1.3);
 document.getElementById('zoom-in').onclick=()=>zoom(1/1.3);
 document.getElementById('zoom-fit').onclick=()=>{view={...initial};renderBoard()};
 document.getElementById('clear-search').onclick=()=>{query='';document.getElementById('search').value='';renderSearch();renderBoard()};
 document.getElementById('search').addEventListener('input',e=>{query=e.target.value;renderSearch();renderBoard()});
 document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter'){let b=document.querySelector('[data-search-id]');if(b)b.click()}});
 document.addEventListener('click',e=>{let target=e.target.closest('[data-port],[data-filter],[data-tab],[data-focus],[data-photo],[data-save-alias],[data-search-id],#close-dialog,#modal-backdrop');if(!target)return;
  if(target.id==='modal-backdrop'&&e.target===target||target.id==='close-dialog'){document.getElementById('overlay-root').innerHTML='';return}
  if(target.dataset.port)pick(target.dataset.port);
  else if(target.dataset.filter){group=target.dataset.filter;renderFilters();renderBoard()}
  else if(target.dataset.tab){tab=target.dataset.tab;renderInspector()}
  else if(target.dataset.focus){let m=MODULES.find(m=>m.id===target.dataset.focus);if(m)focus(m)}
  else if(target.dataset.photo)showModal('photo');
  else if(target.dataset.saveAlias){let m=target.dataset.saveAlias;aliases[m]=(document.getElementById('alias-input')?.value||'').toUpperCase().replace(/[^A-Z0-9_-]/g,'').slice(0,14);save();renderBoard();renderInspector()}
  else if(target.dataset.searchId){pick(target.dataset.searchId);let m=MODULES.find(m=>m.id===target.dataset.searchId.split(':')[0]);if(m)focus(m);query='';document.getElementById('search').value='';renderSearch();}
 });
 const surface=document.getElementById('board-root');
 surface.addEventListener('pointerdown',e=>{if(e.target.closest('[data-port]')||e.button!==0)return;drag={px:e.clientX,py:e.clientY,view:{...view}};surface.setPointerCapture(e.pointerId)});
 surface.addEventListener('pointermove',e=>{if(!drag)return;let rect=surface.getBoundingClientRect();view={...drag.view,x:drag.view.x-(e.clientX-drag.px)*drag.view.w/rect.width,y:drag.view.y-(e.clientY-drag.py)*drag.view.h/rect.height};let svg=document.getElementById('board-svg');if(svg)svg.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`)});
 surface.addEventListener('pointerup',()=>drag=null);surface.addEventListener('pointercancel',()=>drag=null);
 surface.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();zoom(e.deltaY<0?1/1.1:1.1)},{passive:false});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('overlay-root').innerHTML='';if(e.target.tagName==='INPUT')return;if(e.key==='+'||e.key==='=')zoom(1/1.2);if(e.key==='-')zoom(1.2);if(e.key.toLowerCase()==='f'){view={...initial};renderBoard()}});
}
mount();
})();
</script></body></html>
